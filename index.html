<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Heart</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: black;
    overflow: hidden;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
}

#tap {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 24px;
    font-family: Arial, sans-serif;
    z-index: 10;
}
</style>
</head>

<body>

<div id="tap">❤️ Tap Anywhere ❤️</div>

<video autoplay muted loop playsinline>
    <source src="heart%20project.mp4" type="video/mp4">
</video>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
document.body.addEventListener('click', function() {
    document.getElementById('music').play();
    document.getElementById('tap').style.display = 'none';
}, { once: true });
</script>

</body>
</html>
