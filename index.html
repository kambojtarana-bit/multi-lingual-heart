<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Heart ❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

video {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
}

#tap {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: black;
    color: #ffb6c1;

    font-family: "Lucida Calligraphy", cursive;
    font-size: 42px;
    font-weight: bold;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 20px #ff1493,
        0 0 30px #ff1493;

    z-index: 9999;
    cursor: pointer;

    transition: opacity 0.8s ease;
}

.hidden {
    opacity: 0;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="tap">
    ❤️ Tap Anywhere ❤️
</div>

<video id="video" loop playsinline>
    <source src="heart_project.mp4" type="video/mp4">
</video>

<audio id="music" loop>
    <source src="finalised.mp3" type="audio/mpeg">
</audio>

<script>
document.getElementById("tap").addEventListener("click", async function () {

    const video = document.getElementById("video");
    const music = document.getElementById("music");
    const tap = document.getElementById("tap");

    try {

        video.currentTime = 0;
        music.currentTime = 0;

        await Promise.all([
            video.play(),
            music.play()
        ]);

        tap.classList.add("hidden");

        setTimeout(() => {
            tap.style.display = "none";
        }, 800);

    } catch (err) {
        console.error(err);
        alert("Couldn't start audio. Check if finalised.mp3 exists in the repository.");
    }

}, { once: true });
</script>

</body>
</html>
