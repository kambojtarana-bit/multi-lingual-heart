<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Heart ❤️</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

#video {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: black;
}

#tap {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    background: black;
    color: #ffb6c1;

    font-family: "Lucida Calligraphy", cursive;
    font-size: 42px;
    font-weight: bold;

    text-shadow:
        0 0 10px #ff69b4,
        0 0 20px #ff1493,
        0 0 30px #ff1493;

    z-index: 9999;
    cursor: pointer;
}
</style>
</head>

<body>

<video id="video" playsinline preload="auto">
    <source src="heart_project.mp4" type="video/mp4">
</video>

<audio id="music" preload="auto">
    <source src="finalised.mp3" type="audio/mpeg">
</audio>

<div id="tap">
    ❤️ Tap Anywhere ❤️
</div>

<script>
const tap = document.getElementById("tap");
const video = document.getElementById("video");
const music = document.getElementById("music");

tap.addEventListener("click", function () {

    tap.style.display = "none";

    video.currentTime = 0;
    music.currentTime = 0;

    video.play();
    music.play();

}, { once: true });
</script>

</body>
</html>
